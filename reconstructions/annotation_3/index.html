<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thermoelectric Consumptive Water Use by Fuel Type</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <svg
        id="chart"
        viewBox="0 0 1090 613"
        role="img"
        aria-label="Reconstruction of a composite pictorial chart showing thermoelectric consumptive water use by fuel type in 2020"
      ></svg>
      <p class="note">
        Data source: annotation_3.csv. The CSV does not include an explicit fuel-type
        field, so Plant.Code is assigned to the five visible fuel groups by a
        deterministic placeholder mapping in <code>script.js</code>.
      </p>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
